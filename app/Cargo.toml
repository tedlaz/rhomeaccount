[package]
name = "rhomeaccount"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Personal home accounting (egui port of the PySide6 qhomeacc app)"

[dependencies]
rhomeaccount-core = { path = "../core" }
# default features dropped: `default_fonts` bundles Ubuntu + emoji faces we
# replace in theme::install_fonts, and they cost ~1.3 MB in the release binary.
eframe = { version = "=0.31.1", default-features = false, features = [
    "glow",
    "accesskit",
] }
egui_plot = "=0.32.1"
egui_extras = "=0.31.1"
chrono = "0.4"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
